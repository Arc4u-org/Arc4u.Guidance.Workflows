name: Build a Docker image

on: 
  workflow_call:
    inputs:
      DockerContainer:
        description: 'Docker container used to store the images'
        required: true
        type: string    
      DockerImage:
        description: 'Docker image name use to store in a container with no version Tag'
        required: true
        type: string
      DockerImageTagVersion:
        description: 'version Tag'
        required: true
        type: string     
      DockerEnvironmentTagVersion:
        description: 'Environment Tag: Dev - Test - Acc - Prod'
        required: true
        type: string            
      Registry:
        description: 'Name of the container registry'     
        required: true
        type: string     
    secrets:
      CR_User:
        description: 'container registry name'     
        required: true       
      CR_Password:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
     fullImagePath: ${{ steps.imageTag.outputs.fullImagePath }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact

      - name: Save artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: configs
          path: |
            ./Service/Configs
            ./deploy.yml
          retention-days: 90
          
      - name: Remove Folder
        run: rm -rf ./Service/Configs
  
      - name: Ensure DockerImage name is in lower case!
        env:
          DOCKER_IMAGE: ${{ inputs.DockerImage }}
        run: echo "DockerImage=$(echo "$DOCKER_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        id: DockerImageToLower

      - name: Login to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.Registry }}
          username: ${{ secrets.CR_User }}
          password: ${{ secrets.CR_Password }}

      - name: Build and publish the docker image.
        env:
          IMAGE_VERSION: ${{ format('{0}:{1}', steps.DockerImageToLower.outputs.DockerImage, inputs.DockerImageTagVersion) }}
        run: |
          docker build ./Service -f ./Dockerfile -t "$IMAGE_VERSION"
          docker push "$IMAGE_VERSION"

      - name: Tag built container with Azure Container Registry url
        env:
          IMAGE_VERSION: ${{ format('{0}:{1}', steps.DockerImageToLower.outputs.DockerImage, inputs.DockerImageTagVersion) }}
          IMAGE_ENVIRONMENT: ${{ format('{0}:{1}', steps.DockerImageToLower.outputs.DockerImage, inputs.DockerEnvironmentTagVersion) }}
        run: docker tag "$IMAGE_VERSION" "$IMAGE_ENVIRONMENT"

      - name: Push built container to Azure Container Registry
        env:
          IMAGE_ENVIRONMENT: ${{ format('{0}:{1}', steps.DockerImageToLower.outputs.DockerImage, inputs.DockerEnvironmentTagVersion) }}
        run: docker push "$IMAGE_ENVIRONMENT"
