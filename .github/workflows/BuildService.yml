name: Build .NET Service

on:
  workflow_call:
    inputs:
      serviceName:
        description: 'Name of the service'
        required: true
        type: string
      solutionName:
        description: 'Name of the solution'
        required: true
        type: string
      dotNet:
        description: 'Version of the .Net runtime'
        required: true
        type: string
      testFilter:
        description: 'Add a filter expression when running the unit test projects'
        required: true
        type: string
      nuget-source-url:
        description: 'URL of the private NuGet feed'
        required: false
        type: string
        default: ''
      nuget-source-name:
        description: 'Name for the NuGet source'
        required: false
        type: string
        default: 'PrivateFeed'
      nuget-username:
        description: 'Username for NuGet authentication'
        required: false
        type: string
        default: 'az'
    secrets:
      AUTH_NUGET_PASSWORD:
        description: 'PAT for authenticating to the private NuGet feed'
        required: false

permissions:
  contents: read

env:
  serviceRoot: './src/BE/Hosting/${{ inputs.serviceName }}'
  hostRoot: './src/BE/Hosting/${{ inputs.serviceName }}/${{ inputs.solutionName }}.${{ inputs.serviceName }}.Host'
  host: './src/BE/Hosting/${{ inputs.serviceName }}/${{ inputs.solutionName }}.${{ inputs.serviceName }}.Host/${{ inputs.solutionName }}.${{ inputs.serviceName }}.Host.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
           dotnet-version: ${{ inputs.dotNet }}

      - name: Register private NuGet source
        if: ${{ inputs.nuget-source-url != '' }}
        uses: GFlisch/Arc4u.Guidance.Workflows/.github/actions/register-nuget-source@v10
        with:
          source-url: ${{ inputs.nuget-source-url }}
          source-name: ${{ inputs.nuget-source-name }}
          username: ${{ inputs.nuget-username }}
          password: ${{ secrets.AUTH_NUGET_PASSWORD }}

      - name: Run Test projects matching *UnitTest.csproj
        env:
          SERVICE_NAME: ${{ inputs.serviceName }}
          TEST_FILTER: ${{ inputs.testFilter }}
        run: |
            Write-Host "testFilter parameter is set to : $env:TEST_FILTER"
            $filterArgs = if ($env:TEST_FILTER) { @('--filter', $env:TEST_FILTER) } else { @() }
            $failed = 0
            Get-ChildItem -Filter "*.$env:SERVICE_NAME.*UnitTest.csproj" -Recurse | ForEach-Object {
              dotnet test $_.FullName -c $env:buildConfiguration @filterArgs
              if ($LASTEXITCODE -ne 0) { $failed++ }
            }
            if ($failed -gt 0) { Write-Error "$failed test project(s) failed"; exit 1 }
        shell: pwsh

      - name: Build
        run: dotnet publish "${{ env.host }}" --configuration ${{ env.buildConfiguration }} -o ./Service

      - name: Create Dockerfile
        uses: bluwy/substitute-string-action@v4
        with:
          _input-file: './src/BE/Dockerfile'
          _output-file: './Dockerfile'
          _format-key: '%%key%%'
          appName: ${{ inputs.solutionName }}.${{ inputs.serviceName }}.Host.dll

      - name: Copy deploy file
        run: cp "${{ env.serviceRoot }}/deploy.yml" ./deploy.yml

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: |
            ./Service
            ./Dockerfile
            ./deploy.yml
          retention-days: 1
          if-no-files-found: error
